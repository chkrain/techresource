version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: techresource_db
      POSTGRES_USER: techresource_user
      POSTGRES_PASSWORD: techresource123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://techresource_user:techresource123@db:5432/techresource_db

volumes:
  postgres_data: